version: "2"

run:
  issues-exit-code: 1
  tests: false

linters:
  enable:
    - bodyclose
    - contextcheck
    - dupl
    - errcheck
    - errorlint
    - funlen
    - gocognit
    - gocritic
    - gocyclo
    - gosec
    - lll
    - nakedret
    - noctx
    - prealloc
    - staticcheck
    - unconvert
    - unparam
    - unused
  settings:
    dupl:
      threshold: 400
    funlen:
      lines: 85
      statements: 50
    staticcheck:
      checks:
        # Exclude: omit embedded fields from selector expression.
        # https://staticcheck.dev/docs/checks/#QF1008
        - '-QF1008'
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - examples$

formatters:
  enable:
    - gofmt
    - gofumpt
    - goimports
  exclusions:
    generated: lax
    paths:
      - examples$
